# Builds and tests every push and pull request. A v* tag (e.g. v0.2.0) also builds the host and agent bundles and
# publishes them, with their checksums, as that tag's release. Runs on GitHub Actions and on Gitea Actions (the
# private mirror, with its own runner): each builds and publishes its own release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # What gradle/actions would check, which Gitea's runner can't fetch: gradle-wrapper.jar is Gradle's own.
      - name: Check the Gradle wrapper
        run: |
          version=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-\(bin\|all\)\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          echo "$expected  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - run: ./gradlew build
      # Gitea doesn't take artifacts from upload-artifact@v4.
      - name: Test results
        if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*/build/test-results/test/*.xml"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # The release notes are docs/releases/<tag>.md, written before tagging; both sites publish the same text.
      - name: Check the tag matches the version and has release notes
        run: |
          version=$(sed -n 's/^ *version *= *"\(.*\)"/\1/p' build.gradle.kts | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in build.gradle.kts"
            exit 1
          fi
          if [ ! -s "docs/releases/$GITHUB_REF_NAME.md" ]; then
            echo "::error::no release notes in docs/releases/$GITHUB_REF_NAME.md"
            exit 1
          fi
      # The runner is linux-x64: the host app and that agent bundle get runtimes made here; the other agent bundles
      # get Temurin's runtime for their platform, downloaded from Adoptium.
      - name: Build the bundles
        run: |
          ./gradlew :host:hostBundle :agent:agentDist :agent:agentBundle
          ./gradlew :agent:agentBundle -PtargetPlatform=linux-arm64
          ./gradlew :agent:agentBundle -PtargetPlatform=windows-x64
          mkdir release
          cp host/build/dist/*.zip agent/build/dist/*.zip release/
          (cd release && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release on GitHub
        if: github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "Orbit ${GITHUB_REF_NAME#v}" --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Publish the release on Gitea
        if: github.server_url != 'https://github.com'
        env:
          TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          release=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "Orbit ${GITHUB_REF_NAME#v}" \
            --rawfile body "docs/releases/$GITHUB_REF_NAME.md" \
            '{tag_name: $tag, name: $name, body: $body}')
          id=$(curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$release" "$api" | jq -r .id)
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "::error::Gitea didn't create the release"
            exit 1
          fi
          for file in release/*; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$file" \
              "$api/$id/assets?name=$(basename "$file")" > /dev/null
            echo "uploaded $(basename "$file")"
          done
